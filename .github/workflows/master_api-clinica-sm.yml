name: CI/CD Pipeline - Clinica Santa Monica

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # CONFIGURACIÓN DE .NET 9
      # =========================
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # =========================
      # CONFIGURACIÓN DE JAVA 17 (REQUISITO SONAR)
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # =========================
      # CACHÉ DE PAQUETES SONAR
      # =========================
      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # =========================
      # INSTALACIÓN DE HERRAMIENTAS GLOBALES
      # =========================
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # =========================
      # RESTAURACIÓN DE LA SOLUCIÓN
      # =========================
      - name: Restore dependencies
        run: dotnet restore Clinica.sln

      # =========================
      # APERTURA DE ESCANEO SONARCLOUD
      # =========================
      - name: Sonar Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"MathiuZuri_ClinicaSantaMPrUnit"
          /o:"clinicaobssm"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.cobertura.xml"

      # =========================
      # COMPILACIÓN GENERAL
      # =========================
      - name: Build solution
        run: dotnet build Clinica.sln --configuration Release --no-restore

      # =========================
      # EJECUCIÓN DE PRUEBAS UNITARIAS
      # =========================
      - name: Run Unit Tests
        run: >
          dotnet test
          Clinica.API.Tests/Clinica.API.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Unit

      # =========================
      # EJECUCIÓN DE PRUEBAS DE INTEGRACIÓN
      # =========================
      - name: Run Integration Tests
        run: >
          dotnet test
          Clinica.API.IntegrationTests/Clinica.API.IntegrationTests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults/Integration

      # =========================
      # PROCESAMIENTO DE REPORTES DE COBERTURA
      # =========================
      - name: Generate Coverage Report
        run: >
          reportgenerator
          "-reports:**/coverage.cobertura.xml"
          "-targetdir:CoverageReport"
          "-reporttypes:Html"

      # =========================
      # SUBIR EVIDENCIAS A GITHUB ARTIFACTS
      # =========================
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: CoverageReport
          retention-days: 7

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

      # =========================
      # ANÁLISIS DE VULNERABILIDADES CON SNYK
      # =========================
      - name: Install and Run Snyk
        run: |
          npm install -g snyk
          snyk auth ${{ secrets.SNYK_TOKEN }}
          snyk test --file=Clinica.sln --severity-threshold=high

      # =========================
      # CIERRE Y ENVÍO A SONARCLOUD
      # =========================
      - name: Sonar End
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # =========================
      # COMPILACIÓN EXCLUSIVA DE LA CAPA API (CD PREPARATION)
      # =========================
      - name: Publish API Project
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: dotnet publish Clinica.API/Clinica.API.csproj -c Release -o ./publish-folder

      # =========================
      # EMPAQUETAR ARTIFACT EXCLUSIVO DE DESPLIEGUE
      # =========================
      - name: Upload Published API Artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: net-api-app
          path: ./publish-folder
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      # Descargamos únicamente los binarios limpios generados por dotnet publish
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: net-api-app
      
      # Autenticación segura sin credenciales explícitas usando OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B88B085B04AB4B5E835D96EC6A9AEF21 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5E4CF047DE0B4C70B2701097308DAF19 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9BA956A36E4425B9FA485234102F849 }}

      # Despliegue directo al App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-clinica-SM'
          slot-name: 'Production'
          package: .

      # Resumen final en GitHub
      - name: Pipeline Summary
        run: |
          echo "## SIGEC Core Pipeline Success" >> $GITHUB_STEP_SUMMARY
          echo "La capa API fue aislada, compilada y desplegada exitosamente en Azure Web Apps superando las compuertas de SonarCloud y Snyk." >> $GITHUB_STEP_SUMMARY